x = 50
y = 75
role = "Die Wurzel unter der Situation, die zugrunde liegende Ursache, Notwendigkeit oder Grundlage."

[slots.advice]
name = "Rat"
x = 28
y = 50
role = "Die empfohlene Haltung, hilfreiche Herangehensweise oder praktische Orientierung."

[slots.outcome]
name = "Ausgang"
x = 72
y = 50
role = "Der wahrscheinliche Ausgang oder die Richtung, wenn das aktuelle Muster anhält."
